<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insurance Calculators</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; margin:0; padding:0; background:#f8f9fa; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .tabs { display: flex; cursor: pointer; margin-bottom: 20px; }
    .tab { flex: 1; padding: 12px 20px; text-align: center; background: #e0e0e0; border-radius: 6px 6px 0 0; margin-right: 2px; transition: background 0.3s; }
    .tab.active { background: #007bff; color: #fff; font-weight: 600; }
    .tab-content { background: #fff; padding: 20px; border-radius: 0 6px 6px 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); display: none; }
    .tab-content.active { display: block; }
    input, select, button { padding: 8px; margin: 6px 0; width: 100%; max-width: 300px; }
    .result { margin-top: 12px; font-weight: 600; }
    /* Optional: responsive tweaks */
    @media(max-width:768px){ .tabs{flex-direction:column;} .tab{margin-bottom:2px;} }
  </style>
</head>
<body>
  <div class="container">
    <h1>Insurance Calculators</h1>
    <div class="tabs">
      <div class="tab active" data-tab="motor">Motor</div>
      <div class="tab" data-tab="health">Health</div>
      <div class="tab" data-tab="travel">Travel</div>
      <div class="tab" data-tab="property">Property</div>
    </div>

    <!-- MOTOR CALCULATOR -->
    <div class="tab-content active" id="motor">
      <h2>Motor Insurance</h2>
      <label>Vehicle Type</label>
      <select id="motorType">
        <option value="car">Car</option>
        <option value="bodaboda">Bodaboda</option>
        <option value="truck">Truck</option>
      </select>
      <label>Vehicle Value (TZS)</label>
      <input type="number" id="motorValue" placeholder="Enter value">
      <button onclick="calculateMotor()">Calculate</button>
      <div class="result" id="motorResult"></div>
    </div>

    <!-- HEALTH CALCULATOR -->
    <div class="tab-content" id="health">
      <h2>Health Insurance</h2>
      <label>Age</label>
      <input type="number" id="healthAge" placeholder="Enter age">
      <label>Plan Type</label>
      <select id="healthPlan">
        <option value="basic">Basic</option>
        <option value="comprehensive">Comprehensive</option>
      </select>
      <button onclick="calculateHealth()">Calculate</button>
      <div class="result" id="healthResult"></div>
    </div>

    <!-- TRAVEL CALCULATOR -->
    <div class="tab-content" id="travel">
      <h2>Travel Insurance</h2>
      <label>Trip Duration (days)</label>
      <input type="number" id="travelDays" placeholder="Enter days">
      <label>Destination Risk Level</label>
      <select id="travelRisk">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
      <button onclick="calculateTravel()">Calculate</button>
      <div class="result" id="travelResult"></div>
    </div>

    <!-- PROPERTY CALCULATOR -->
    <div class="tab-content" id="property">
      <h2>Property Insurance</h2>
      <label>Property Value (TZS)</label>
      <input type="number" id="propertyValue" placeholder="Enter value">
      <label>Property Type</label>
      <select id="propertyType">
        <option value="residential">Residential</option>
        <option value="commercial">Commercial</option>
      </select>
      <button onclick="calculateProperty()">Calculate</button>
      <div class="result" id="propertyResult"></div>
    </div>
  </div>

  <script>
    // TAB SWITCHING
    const tabs = document.querySelectorAll('.tab');
    const contents = document.querySelectorAll('.tab-content');
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        contents.forEach(c => c.classList.remove('active'));
        document.getElementById(tab.dataset.tab).classList.add('active');
      });
    });

    // MOTOR CALCULATION LOGIC
    function calculateMotor() {
      const type = document.getElementById('motorType').value;
      const value = parseFloat(document.getElementById('motorValue').value);
      if(isNaN(value) || value<=0){ alert('Enter a valid value'); return; }
      let premium = 0;
      if(type==='car'){ premium = value*0.05; }
      else if(type==='bodaboda'){ premium = value*0.03; }
      else if(type==='truck'){ premium = value*0.06; }
      document.getElementById('motorResult').innerText = `Premium: TZS ${premium.toLocaleString()}`;
    }

    // HEALTH CALCULATION LOGIC
    function calculateHealth() {
      const age = parseInt(document.getElementById('healthAge').value);
      const plan = document.getElementById('healthPlan').value;
      if(isNaN(age) || age<=0){ alert('Enter a valid age'); return; }
      let premium = (plan==='basic') ? 50000 : 100000;
      if(age>50){ premium *= 1.5; }
      document.getElementById('healthResult').innerText = `Premium: TZS ${premium.toLocaleString()}`;
    }

    // TRAVEL CALCULATION LOGIC
    function calculateTravel() {
      const days = parseInt(document.getElementById('travelDays').value);
      const risk = document.getElementById('travelRisk').value;
      if(isNaN(days) || days<=0){ alert('Enter valid days'); return; }
      let base = 10000*days;
      if(risk==='medium'){ base *= 1.2; }
      else if(risk==='high'){ base *= 1.5; }
      document.getElementById('travelResult').innerText = `Premium: TZS ${base.toLocaleString()}`;
    }

    // PROPERTY CALCULATION LOGIC
    function calculateProperty() {
      const value = parseFloat(document.getElementById('propertyValue').value);
      const type = document.getElementById('propertyType').value;
      if(isNaN(value) || value<=0){ alert('Enter a valid value'); return; }
      let premium = (type==='residential') ? value*0.04 : value*0.06;
      document.getElementById('propertyResult').innerText = `Premium: TZS ${premium.toLocaleString()}`;
    }
  </script>
</body>
</html>
