<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wolfguard Insurance - Insure. Protect. Grow.</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- SEO Meta Tags -->
  <meta name="description" content="Free premium calculation + instant WhatsApp & email agent connect. File a claim online. Get renewal reminders. Business insurance in Tanzania." />
  <meta name="keywords" content="Insurance Tanzania, Business Insurance, Fleet Insurance, Claim Filing, Renewal Reminder, Wolfguard Insurance" />
  <meta name="author" content="Wolfguard Insurance" />

  <!-- Structured Data (Local Business SEO / Tanzania) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "name": "Wolfguard Insurance",
    "address": {"@type": "PostalAddress", "addressCountry": "TZ"},
    "contactPoint": {"@type": "ContactPoint", "contactType": "customer service", "email": "wolfgangvictor75@gmail.com", "telephone": "+255769715177"}
  }
  </script>

  <style>
    body { background: #0A1A2F; color: #ffffff; }
    .card { background: #1b2738; border-radius: 12px; padding: 2rem; }
    .btn { background: #1F4B99; padding: .75rem 1.5rem; border-radius: 8px; color: #fff; font-weight: bold; }
    .btn:hover { background: #11356b; }
  </style>
</head>
<body class="font-sans">

  <!-- HERO SECTION -->
  <section class="text-center py-20">
    <h1 class="text-4xl font-bold">INSURE. PROTECT. GROW.</h1>
    <p class="mt-4 text-lg">Free premium calculation + instant WhatsApp & email agent connect.</p>
    <div class="mt-6 space-x-3">
      <a href="#calculator" class="btn">Calculate Premium</a>
      <a href="#contact" class="btn">Talk to Agent</a>
    </div>
  </section>

  <!-- TRUST SECTION -->
  <section class="py-10 text-center">
    <p class="text-lg opacity-70">Trusted by companies across Tanzania</p>
  </section>

  <!-- PREMIUM CALCULATOR SECTION -->
  <section id="calculator" class="px-6 py-12">
    <div class="card">
      <h2 class="text-xl font-semibold mb-3">Premium Calculator</h2>
      <!-- Existing calculator content will be merged here in next step -->
    </div>
  </section>

  <!-- FILE CLAIM SECTION -->
  <section id="claim" class="px-6 py-12">
    <div class="card">
      <h2 class="text-xl font-semibold mb-6">File Claim Online</h2>
      <form id="claimForm">
        <input class="w-full p-2 mb-3 text-black" type="text" name="policyNumber" placeholder="Policy Number" required />
        <textarea class="w-full p-2 mb-3 text-black" name="incident" placeholder="Describe the incident" required></textarea>
        <input class="w-full p-2 mb-3 text-black" type="file" name="attachments" />
        <button type="submit" class="btn w-full">Submit Claim</button>
      </form>
    </div>
  </section>

  <!-- RENEWAL REMINDER SECTION -->
  <section id="renewal" class="px-6 py-12">
    <div class="card">
      <h2 class="text-xl font-semibold mb-6">Set Renewal Reminder</h2>
      <form id="reminderForm">
        <input class="w-full p-2 mb-3 text-black" type="text" name="clientName" placeholder="Your Name" required />
        <input class="w-full p-2 mb-3 text-black" type="email" name="clientEmail" placeholder="Your Email" required />
        <input class="w-full p-2 mb-3 text-black" type="tel" name="clientPhone" placeholder="Phone Number" required />
        <input class="w-full p-2 mb-3 text-black" type="date" name="renewalDate" required />
        <button type="submit" class="btn w-full">Set Reminder</button>
      </form>
    </div>
  </section>

  <!-- CONTACT SECTION -->
  <section id="contact" class="text-center py-12">
    <p>Email: <strong>wolfgangvictor75@gmail.com</strong></p>
    <p>WhatsApp: <strong>+255 769 715 177</strong></p>
  </section>

  <script>
    document.querySelector("#claimForm").addEventListener("submit", function(e) {
      e.preventDefault();
      alert("✅ Thank you — your claim has been submitted and is being processed.");
      window.open(`https://wa.me/255769715177?text=New Claim Filed`, "_blank");
    });

    document.querySelector("#reminderForm").addEventListener("submit", function(e) {
      e.preventDefault();
      alert("✅ Reminder successfully set — we will notify you before your renewal date.");
      window.open(`https://wa.me/255769715177?text=Renewal Reminder Set`, "_blank");
    });
  </script>

</body>
</html>
