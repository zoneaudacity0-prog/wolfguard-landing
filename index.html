<!-- LIFE INSURANCE CALCULATOR -->
<section id="lifeCalc" class="bg-white p-6 max-w-4xl mx-auto rounded-xl shadow mb-12">
  <h2 class="text-2xl font-bold text-blue-800">Life Insurance Estimator</h2>
  <p class="text-sm text-gray-600 mt-1">Estimate premium based on sum assured and age group.</p>

  <div class="mt-4 space-y-3">
    <input id="lifeSum" type="number" class="p-2 border rounded w-full" placeholder="Sum Assured (TZS)" />

    <select id="lifeAge" class="p-2 w-full border rounded">
      <option value="">Select Age Group</option>
      <option value="0.012">18–35 yrs</option>
      <option value="0.018">36–50 yrs</option>
      <option value="0.025">51+ yrs</option>
    </select>

    <button onclick="calcLife()" class="bg-green-600 text-white w-full py-2 rounded">Calculate</button>

    <div id="lifeResult" class="hidden mt-3 p-3 bg-gray-50 rounded text-blue-700 font-semibold"></div>
  </div>
</section>

<script>
function calcLife() {
  let sum = Number(document.getElementById("lifeSum").value);
  let rate = Number(document.getElementById("lifeAge").value);

  if (!sum || !rate) return alert("Enter all fields.");

  let premium = sum * rate;

  document.getElementById("lifeResult").classList.remove("hidden");
  document.getElementById("lifeResult").innerHTML = 
    "Estimated Annual Premium: " + premium.toLocaleString() + " TZS";
}
</script>
