<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Motor Insurance Premium Calculator - Wolfguard Insurance</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <div class="max-w-3xl mx-auto mt-10 p-6 bg-white rounded-2xl shadow-lg">
    <h1 class="text-2xl font-bold text-center mb-6 text-blue-800">🚗 Motor Insurance Premium Calculator</h1>

    <!-- Vehicle Class -->
    <div class="mb-4">
      <label class="block font-semibold mb-1">Vehicle Class</label>
      <select id="vehicleClass" class="w-full p-2 border rounded">
        <option value="">-- Select Vehicle Class --</option>
        <option value="Private Cars">Private Cars</option>
        <option value="Motorcycles">Motorcycles (2 Wheelers)</option>
        <option value="Three Wheelers">Three Wheelers</option>
        <option value="Commercial Own Goods">Commercial Goods (Own Goods)</option>
        <option value="Commercial Cartage">Commercial General Cartage</option>
        <option value="Trailers <10yrs">Trailers (&lt;10 yrs)</option>
        <option value="Trailers >10yrs">Trailers (&gt;10 yrs)</option>
        <option value="Oil Tanker Steel">Oil Tanker (Steel)</option>
        <option value="Oil Tanker Aluminium">Oil Tanker (Aluminium)</option>
        <option value="Oil Tanker Old">Oil Tanker (&gt;10 yrs)</option>
        <option value="Passenger Taxis">Passenger Vehicles (Taxis, etc.)</option>
        <option value="Daladala">Bus - Daladala (City)</option>
        <option value="Upcountry">Bus - Upcountry</option>
        <option value="Private Bus">Bus - Private</option>
        <option value="School Bus">Bus - School</option>
        <option value="Special Type">Special Type Vehicles</option>
      </select>
    </div>

    <!-- Type of Cover -->
    <div class="mb-4">
      <label class="block font-semibold mb-1">Type of Cover</label>
      <select id="coverType" class="w-full p-2 border rounded">
        <option value="">-- Select Type of Cover --</option>
        <option value="Comprehensive">Comprehensive</option>
        <option value="Third Party">Third Party (TPO)</option>
      </select>
    </div>

    <!-- Claim Record -->
    <div id="claimRecordSection" class="mb-4 hidden">
      <label class="block font-semibold mb-1">Claim Record</label>
      <select id="claimRecord" class="w-full p-2 border rounded">
        <option value="claimsFree">Claims Free</option>
        <option value="withClaim">With Claim Record</option>
      </select>
    </div>

    <!-- Sum Insured -->
    <div id="sumInsuredSection" class="mb-4 hidden">
      <label class="block font-semibold mb-1">Sum Insured (TZS)</label>
      <input type="number" id="sumInsured" class="w-full p-2 border rounded" placeholder="Enter Sum Insured" />
    </div>

    <!-- Passenger Seats -->
    <div id="seatSection" class="mb-4 hidden">
      <label class="block font-semibold mb-1">Number of Seats (For Passenger Vehicles)</label>
      <input type="number" id="numSeats" class="w-full p-2 border rounded" placeholder="Enter Number of Seats" />
    </div>

    <!-- Bodaboda / Passenger -->
    <div id="passengerOption" class="mb-4 hidden">
      <label class="inline-flex items-center">
        <input type="checkbox" id="isPassenger" class="mr-2" />
        Vehicle carries passenger (Bodaboda / 3-Wheeler Passenger)
      </label>
    </div>

    <!-- Commercial Vehicle Weight -->
    <div id="weightSection" class="mb-4 hidden">
      <label class="block font-semibold mb-1">Vehicle Weight (Tonnes)</label>
      <input type="number" id="weight" class="w-full p-2 border rounded" placeholder="Enter Vehicle Weight in Tonnes" />
    </div>

    <!-- Calculate Button -->
    <button onclick="calculatePremium()" class="w-full bg-blue-700 hover:bg-blue-800 text-white p-2 rounded font-semibold mt-4">
      Calculate Premium
    </button>

    <!-- Result -->
    <div id="result" class="mt-6 text-center font-semibold text-lg text-green-700"></div>
  </div>

  <script>
    const vehicleClass = document.getElementById("vehicleClass");
    const coverType = document.getElementById("coverType");
    const claimRecordSection = document.getElementById("claimRecordSection");
    const sumInsuredSection = document.getElementById("sumInsuredSection");
    const seatSection = document.getElementById("seatSection");
    const passengerOption = document.getElementById("passengerOption");
    const weightSection = document.getElementById("weightSection");
    const VAT = 1.18;

    coverType.addEventListener("change", () => {
      const type = coverType.value;
      claimRecordSection.classList.toggle("hidden", type !== "Comprehensive");
      sumInsuredSection.classList.toggle("hidden", type !== "Comprehensive");
      seatSection.classList.add("hidden");
      passengerOption.classList.add("hidden");
      weightSection.classList.add("hidden");

      if (type === "Third Party") {
        if (vehicleClass.value.includes("Motorcycles") || vehicleClass.value.includes("Three Wheelers")) passengerOption.classList.remove("hidden");
        if (vehicleClass.value.includes("Passenger") || vehicleClass.value.includes("Bus")) seatSection.classList.remove("hidden");
        if (vehicleClass.value.includes("Commercial")) weightSection.classList.remove("hidden");
      }
    });

    function calculatePremium() {
      const vClass = vehicleClass.value;
      const type = coverType.value;
      const sumInsured = parseFloat(document.getElementById("sumInsured").value) || 0;
      const claim = document.getElementById("claimRecord")?.value;
      const seats = parseFloat(document.getElementById("numSeats")?.value) || 0;
      const weight = parseFloat(document.getElementById("weight")?.value) || 0;
      const carriesPassenger = document.getElementById("isPassenger").checked;
      let premium = 0;

      if (type === "Third Party") {
        switch (vClass) {
          case "Private Cars": premium = 100000 * VAT; break;
          case "Motorcycles": premium = (50000 + (carriesPassenger ? 15000 : 0)) * VAT; break;
          case "Three Wheelers": premium = (75000 + (carriesPassenger ? 45000 : 0)) * VAT; break;
          case "Commercial Own Goods":
            if (weight <= 2) premium = 150000 * VAT;
            else if (weight <= 5) premium = 200000 * VAT;
            else if (weight <= 10) premium = 250000 * VAT;
            else premium = 300000 * VAT;
            break;
          case "Commercial Cartage": premium = 350000 * VAT; break;
          case "Trailers <10yrs":
          case "Trailers >10yrs": premium = 100000 * VAT; break;
          case "Oil Tanker Steel":
          case "Oil Tanker Aluminium":
          case "Oil Tanker Old": premium = 750000 * VAT; break;
          case "Passenger Taxis": premium = Math.max(150000, seats * 15000 * VAT); break;
          case "Daladala": premium = Math.max(150000, seats * 15000 * VAT); break;
          case "Upcountry": premium = Math.max(150000, seats * 30000 * VAT); break;
          case "Private Bus": premium = Math.max(150000, seats * 10000 * VAT); break;
          case "School Bus": premium = Math.max(150000, seats * 7500 * VAT); break;
          case "Special Type": premium = 100000 * VAT; break;
        }
      }

      else if (type === "Comprehensive") {
        switch (vClass) {
          case "Private Cars": premium = sumInsured * (claim === "claimsFree" ? 0.035 : 0.04) * VAT; premium = Math.max(premium, 250000); break;
          case "Motorcycles": premium = ((sumInsured * (claim === "claimsFree" ? 0.05 : 0.06)) + (carriesPassenger ? 15000 : 0)) * VAT; break;
          case "Three Wheelers": premium = ((sumInsured * (claim === "claimsFree" ? 0.06 : 0.07)) + (carriesPassenger ? 45000 : 0)) * VAT; break;
          case "Commercial Own Goods": premium = Math.max(sumInsured * (claim === "claimsFree" ? 0.0425 : 0.0475) * VAT, 500000); break;
          case "Commercial Cartage": premium = Math.max(sumInsured * (claim === "claimsFree" ? 0.05 : 0.0575) * VAT, 500000); break;
          case "Trailers <10yrs": premium = sumInsured * (claim === "claimsFree" ? 0.04 : 0.0475) * VAT; break;
          case "Trailers >10yrs": premium = sumInsured * (claim === "claimsFree" ? 0.0525 : 0.0575) * VAT; break;
          case "Oil Tanker Steel": premium = Math.max(sumInsured * 0.06 * VAT, 2000000); break;
          case "Oil Tanker Aluminium": premium = Math.max(sumInsured * 0.07 * VAT, 2000000); break;
          case "Oil Tanker Old": premium = Math.max(sumInsured * 0.08 * VAT, 2000000); break;
          case "Passenger Taxis": premium = ((sumInsured * (claim === "claimsFree" ? 0.055 : 0.06)) + seats * 15000) * VAT; premium = Math.max(premium, 500000); break;
          case "Daladala": premium = ((sumInsured * 0.08) + (seats * 15000)) * VAT; premium = Math.max(premium, 2000000); break;
          case "Upcountry": premium = ((sumInsured * 0.08) + (seats * 30000)) * VAT; break;
          case "Private Bus": premium = ((sumInsured * 0.05) + (seats * 10000)) * VAT; break;
          case "School Bus": premium = ((sumInsured * 0.05) + (seats * 7500)) * VAT; break;
          case "Special Type": premium = Math.max(sumInsured * 0.02 * VAT, 250000); break;
        }
      }

      document.getElementById("result").innerText = premium > 0
        ? `Estimated Premium: TZS ${premium.toLocaleString("en-TZ", { minimumFractionDigits: 0 })}`
        : "Please fill all required details correctly.";
    }
  </script>
</body>
</html>
